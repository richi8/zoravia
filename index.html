<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Zoravia: a browser monster-collecting RPG. Catch and train Zorlings across three regions."
    />
    <meta name="theme-color" content="#0d0f1f" />
    <title>Zoravia</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d0f1f;
        color: #f5f6fb;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      /* Shown until the title screen is up (C38); main.ts removes it or shows an error. */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        font:
          600 18px/1.4 system-ui,
          sans-serif;
        text-align: center;
        color: #f5f6fb;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot" role="status">Loading Zoravia…</div>
    <noscript><p style="padding: 16px">Zoravia needs JavaScript to run.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
